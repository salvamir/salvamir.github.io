<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colección De Fotos</title>
  <style>
    :root {
      --bg-main: #1a1714;
      --text-main: #e3ded6;
      --accent: #b7966c;
      --modal-bg: rgba(0, 0, 0, 0.85);
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: "New York", Georgia, serif;
    }

    .gallery-container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .gallery-title {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 2rem;
    }

    /* --- LA MAGIA ESTILO PINTEREST --- */
    .gallery-grid {
      column-count: 1;
      column-gap: 15px;
    }

    @media (min-width: 600px) {
      .gallery-grid { column-count: 2; }
    }

    @media (min-width: 1020px) {
      .gallery-grid { column-count: 3; }
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 15px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    /* Animación interactiva al pasar el mouse */
    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
      filter: brightness(1.1);
    }

    /* --- ESTILOS DEL MODAL (LIGHTBOX) --- */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 999; 
      padding-top: 50px; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%; 
      overflow: auto; 
      background-color: var(--modal-bg);
      backdrop-filter: blur(5px);
    }

    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      animation: zoomIn 0.3s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
    }

    .close-btn:hover, .close-btn:focus {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="gallery-container">
  <h1 class="gallery-title">Mi Galería</h1>
  
  <div class="gallery-grid">
    <div class="gallery-item">
      <img src="/fotos-galeria/3.jpeg" alt="paquillo corriendo, la sacaron drac y lolo y está genial.">
    </div>
    
    <div class="gallery-item">
      <img src="/fotos-galeria/8.jpg" alt="no se en qué año habremos estado, pero estaba de viaje en punta cana e hicimos videollamada con german y la emi mientras estaban en ingles y me acuerdo patente de ese momento todavía.">
    </div>
    
    <div class="gallery-item">
      <img src="/fotos-galeria/amaicha.jpg" alt="del viaje de campo de levantamiento, tenía un sueño.">
    </div>
    
    <div class="gallery-item">
      <img src="/fotos-galeria/conmaxii.jpg" alt="fue durante la cena de la campaña de geomorfo, me re gustó ese viaje, se me hizo muy tranquilo y lo disfruté mucho">
    </div>
    
    <div class="gallery-item">
      <img src="/fotos-galeria/dracamigomio.png" alt="la robé de un estado de la fer. Me encantó, facu sale muy contento y me saca una sonrisa ver esta foto.">
    </div>
    
    <div class="gallery-item">
      <img src="/fotos-galeria/enfermo.jpg" alt="me gusta mucho esta foto porque ASI LITERALMENTE se siente enfermarse, y yo me enfermo seguido">
    </div>
    
    <div class="gallery-item">
      <img src="/fotos-galeria/facucumpliendomisueño.png" alt="me encantaría ir a Legoland algún día y facu ya me ganó">
    </div>
    
    <div class="gallery-item">
      <img src="/fotos-galeria/felizcumplewid.jpeg" alt="encontré esta foto de mini leonchi y se lo ve muy contento">
    </div>
    
    <div class="gallery-item">
      <img src="/fotos-galeria/letiyleonchiminis.jpg" alt="cuando eran minis, ahora ya son jovenzuelos">
    </div>
    
    <div class="gallery-item">
      <img src="/fotos-galeria/minileti.jpeg" alt="que cutee">
    </div>
    
    <div class="gallery-item">
      <img src="/fotos-galeria/mispapas.jpg" alt="me encanta esta foto, se los ve re entusiasmados">
    </div>
    
    <div class="gallery-item">
      <img src="/fotos-galeria/salvaylolopequeños.jpg" alt="eramos muy pequeños y compinches">
    </div>
    
    <div class="gallery-item">
      <img src="/fotos-galeria/paseandoconlaemii.jpg" alt="ese día me gustó mucho. Fuimos a pasear topmente al alterpoint y llevé el celu chiquito para sacarnos fotos lindas por primera vez. nunca nunca nos sacamos fotos">
    </div>
    
    <div class="gallery-item">
      <img src="/fotos-galeria/otoñoenmicasa.jpg" alt="esta foto representa perfectamente como se siente el otoño aca en mi casa">
    </div>
    
    <div class="gallery-item">
      <img src="/fotos-galeria/otoñoenlafacultad.jpg" alt="no quiero olvidarme de esta foto cuando vuelva el verano che">
    </div>
  </div>
</div>

<div id="imageModal" class="modal">
  <span class="close-btn">&times;</span>
  <img class="modal-content" id="modalImg">
</div>

<script>
  // Lógica interactiva para la galería
  document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImg");
    const closeBtn = document.querySelector(".close-btn");
    const galleryItems = document.querySelectorAll(".gallery-item img");

    // Abrir la imagen en grande al hacer click
    galleryItems.forEach(img => {
      img.addEventListener('click', function() {
        modal.style.display = "block";
        modalImg.src = this.src; 
      });
    });

    // Cerrar con la cruz
    closeBtn.addEventListener('click', () => {
      modal.style.display = "none";
    });

    // Cerrar haciendo click en cualquier lado afuera de la imagen
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.style.display = "none";
      }
    });

    // Cerrar con la tecla Escape del teclado
    document.addEventListener('keydown', (e) => {
      if (e.key === "Escape" && modal.style.display === "block") {
        modal.style.display = "none";
      }
    });
  });
</script>

</body>
</html>
