<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The House.</title>
  <script src="https://unpkg.com/kaboom@3000.1.17/dist/kaboom.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>

<script>
  // =========================================================================
  // 1. KABOOM INITIALIZATION
  // =========================================================================
  kaboom({
    width: 1920,
    height: 1080,
    letterbox: true,
    background: [0, 0, 0],
  });

  // =========================================================================
  // 2. RESOURCE LOADING (ROOMS, OBJECTS & SOUNDS)
  // =========================================================================
  // Background Rooms
  loadSprite("sala1", "assets/salas/sala1.png");
  loadSprite("sala2", "assets/salas/sala2.png");
  loadSprite("sala3", "assets/salas/sala3.png");
  loadSprite("sala4", "assets/salas/sala4.png");
  loadSprite("sala5", "assets/salas/sala5.png");

  // Objects
  loadSprite("papel", "assets/objects/papel.png");
  loadSprite("pizarra", "assets/objects/pizarra.png");
  loadSprite("pizarra_papel", "assets/objects/pizarra_papel.png");
  loadSprite("cuchillo", "assets/objects/cuchillo.png");
  loadSprite("osito", "assets/objects/osito.png");
  loadSprite("osito_roto", "assets/objects/osito_roto.png");
  loadSprite("comoda", "assets/objects/comoda.png");
  loadSprite("cajon1_abierto", "assets/objects/cajon1_abierto.png");
  loadSprite("cajon2_abierto", "assets/objects/cajon2_abierto.png");
  loadSprite("cajon3_abierto", "assets/objects/cajon3_abierto.png");
  loadSprite("lampara_apagada", "assets/objects/lampara_apagada.png");
  loadSprite("lampara_encendida", "assets/objects/lampara_encendida.png");
  loadSprite("foco", "assets/objects/foco.png");
  loadSprite("cuaderno", "assets/objects/cuaderno.png");
  loadSprite("encendedor", "assets/objects/encendedor.png");
  loadSprite("llave", "assets/objects/llave.png");

  // Sound Effects
  loadSound("musica", "assets/sounds/musica_fondo.mp3");
  loadSound("clickSFX", "assets/sounds/click.mp3");
  loadSound("hoverSFX", "assets/sounds/hover.mp3");
  loadSound("cortaSFX", "assets/sounds/corta.mp3");
  loadSound("llaveSFX", "assets/sounds/key.mp3");
  loadSound("cajonSFX", "assets/sounds/drawer.mp3");
  loadSound("lamparaSFX", "assets/sounds/light.mp3");
  loadSound("fuegoSFX", "assets/sounds/burn.mp3");
  loadSound("typewriterSFX", "assets/sounds/typewriter.mp3");

  // =========================================================================
  // 3. GLOBAL STATE
  // =========================================================================
  let musicaIniciada = false;
  const inventario = []; 
  let itemSeleccionado = null; 
  let typewriterLoop = null; 

  // Room 3 State Flags
  let s3_papelRecogido = false;
  let s3_papelPinchado = false;
  let s3_cuchilloRecogido = false;
  let s3_ositoRoto = false;
  let s3_llave1Recogida = false;
  let s3_cajon1Abierto = false;
  let s3_focoRecogido = false;
  let s3_focoPuesto = false;
  let s3_cuadernoRecogido = false;
  let s3_acertijoResuelto = false;
  let s3_encendedorRecogido = false;
  let s3_pizarraQuemada = false;
  let s3_llaveSalidaRecogida = false;

  // =========================================================================
  // 4. HELPER FUNCTIONS, INVENTORY & ANIMATIONS
  // =========================================================================
  function reproducirMusica() {
    if (!musicaIniciada) {
      play("musica", { loop: true, volume: 0.4 });
      musicaIniciada = true;
    }
  }

  function mostrarTexto(mensaje) {
    destroyAll("cajaTexto");

    if (typewriterLoop) {
      typewriterLoop.cancel();
      typewriterLoop = null;
    }

    add([
      rect(1100, 120, { radius: 10 }),
      pos(960, 960),
      anchor("center"),
      color(15, 15, 15),
      outline(3, rgb(231, 200, 160)),
      fixed(),
      z(100),
      "cajaTexto"
    ]);

    const objetoTexto = add([
      text("", { size: 22, width: 1040, align: "center" }),
      pos(960, 960),
      anchor("center"),
      color(238, 221, 204),
      fixed(),
      z(101),
      "cajaTexto"
    ]);

    let charIdx = 0;
    const velocidadLectura = 0.04;

    typewriterLoop = loop(velocidadLectura, () => {
      if (charIdx < mensaje.length) {
        charIdx++;
        objetoTexto.text = mensaje.slice(0, charIdx);

        const caracterActual = mensaje[charIdx - 1];
        if (caracterActual !== " " && charIdx % 2 === 0) {
          play("typewriterSFX", { volume: 0.2, speed: rand(0.95, 1.05) });
        }
      } else {
        if (typewriterLoop) {
          typewriterLoop.cancel();
          typewriterLoop = null;
        }

        wait(4, () => {
          if (objetoTexto.text === mensaje) {
            destroyAll("cajaTexto");
          }
        });
      }
    });
  }

  function animarFuego(x, y, alTerminar) {
    play("fuegoSFX");
    let duracion = 0;
    const loopFuego = loop(0.05, () => {
      duracion += 0.05;
      for (let i = 0; i < 4; i++) {
        const p = add([
          rect(rand(8, 22), rand(8, 22)),
          pos(x + rand(-60, 60), y + rand(-40, 40)),
          color(255, rand(60, 200), 0),
          opacity(1),
          z(80)
        ]);
        p.onUpdate(() => {
          p.pos.y -= rand(2, 6);
          p.opacity -= 0.04;
          if (p.opacity <= 0) destroy(p);
        });
      }
      if (duracion >= 1.5) {
        loopFuego.cancel();
        if (alTerminar) alTerminar();
      }
    });
  }

  function agregarAlInventario(id, nombre) {
    if (!inventario.some(item => item.id === id)) {
      inventario.push({ id, nombre });
      renderizarInventario();
    }
  }

  function removerDelInventario(id) {
    const idx = inventario.findIndex(item => item.id === id);
    if (idx !== -1) {
      inventario.splice(idx, 1);
      if (itemSeleccionado === id) itemSeleccionado = null;
      renderizarInventario();
    }
  }

  function renderizarInventario() {
    destroyAll("uiInventario");

    add([
      rect(1920, 80),
      pos(0, 0),
      color(15, 15, 15),
      opacity(0.9),
      fixed(),
      z(90),
      "uiInventario"
    ]);

    inventario.forEach((item, index) => {
      const slotX = 40 + (index * 170);
      const esSeleccionado = (itemSeleccionado === item.id);

      const slot = add([
        rect(150, 60, { radius: 8 }),
        pos(slotX, 10),
        color(esSeleccionado ? rgb(231, 200, 160) : rgb(40, 40, 40)),
        outline(2, esSeleccionado ? rgb(255, 255, 255) : rgb(100, 100, 100)),
        area(),
        fixed(),
        z(91),
        "uiInventario"
      ]);

      add([
        text(item.nombre, { size: 18, width: 140, align: "center" }),
        pos(slotX + 75, 40),
        anchor("center"),
        color(esSeleccionado ? rgb(0, 0, 0) : rgb(240, 240, 240)),
        fixed(),
        z(92),
        "uiInventario"
      ]);

      slot.onHover(() => {
        setCursor("pointer");
      });

      slot.onHoverEnd(() => {
        setCursor("default");
      });

      slot.onClick(() => {
        play("clickSFX");
        itemSeleccionado = (itemSeleccionado === item.id) ? null : item.id;
        renderizarInventario();
      });
    });
  }

  function crearZonaInteractiva(x, y, ancho, alto, alHacerClic) {
    const zona = add([
      rect(ancho, alto),
      pos(x, y),
      anchor("center"),
      opacity(0),
      area(),
      z(80)
    ]);

    let estaSobreElemento = false;

    zona.onClick(() => {
      reproducirMusica();
      play("clickSFX");
      setCursor("default");
      alHacerClic();
    });

    zona.onHover(() => {
      setCursor("pointer");
      if (!estaSobreElemento) {
        reproducirMusica();
        play("hoverSFX");
        estaSobreElemento = true;
      }
    });

    zona.onHoverEnd(() => {
      setCursor("default");
      estaSobreElemento = false;
    });

    return zona;
  }

  // =========================================================================
  // 5. GAME SCENES
  // =========================================================================

  // --- ROOM 1 ---
  scene("sala1", () => {
    add([
      sprite("sala1"),
      pos(960, 540),
      anchor("center"),
      z(0)
    ]);

    crearZonaInteractiva(610, 1000, 127, 133, () => go("sala2"));
    crearZonaInteractiva(75, 265, 124, 529, () => { window.top.location.href = "https://salvamir.github.io/tags/yuyo"; });
    crearZonaInteractiva(1080, 1000, 807, 144, () => { window.top.location.href = "https://salvamir.github.io/tags/helecho"; });
    crearZonaInteractiva(1520, 620, 67, 641, () => { window.top.location.href = "https://salvamir.github.io/tags/arbolito"; });
    crearZonaInteractiva(1490, 200, 146, 165, () => { window.top.location.href = "https://salvamir.github.io"; });
    crearZonaInteractiva(57, 650, 102, 157, () => { mostrarTexto("It's a rock... who knows what its petrogenetic history might be."); });
  });

  // --- ROOM 2 ---
  scene("sala2", () => {
    add([
      sprite("sala2"),
      pos(960, 540),
      anchor("center"),
      z(0)
    ]);

    crearZonaInteractiva(770, 70, 182, 127, () => go("sala1"));
    crearZonaInteractiva(1470, 740, 187, 125, () => go("sala3"));
    crearZonaInteractiva(95, 740, 174, 138, () => go("sala4"));
  });

  // =========================================================================
  // --- ROOM 3: ESCAPE ROOM ---
  // =========================================================================
  scene("sala3", () => {
    // Fondo centrado
    add([
      sprite("sala3"),
      pos(960, 540),
      anchor("center"),
      z(0)
    ]);
    
    renderizarInventario();

    // ---------------------------------------------------------------------
    // PASO 1: PAPEL EN EL SUELO
    // ---------------------------------------------------------------------
    if (!s3_papelRecogido) {
      add([
        sprite("papel"),
        pos(750, 820),
        anchor("center"),
        scale(0.35),
        z(5)
      ]);

      crearZonaInteractiva(750, 820, 180, 180, () => {
        s3_papelRecogido = true;
        agregarAlInventario("papel", "Paper");
        mostrarTexto("Welcome to my house. Whenever you dive deeper into your mind, is not sure you will know the path outside. Want to give the adventure a try?");
        go("sala3");
      });
    }

    // ---------------------------------------------------------------------
    // PASO 2: PIZARRA, NOTA PINCHADA Y CUCHILLO
    // ---------------------------------------------------------------------
    const posPizarraX = 350;
    const posPizarraY = 260;

    if (!s3_pizarraQuemada) {
      const spritePizarraNombre = s3_papelPinchado ? "pizarra_papel" : "pizarra";
      
      add([
        sprite(spritePizarraNombre),
        pos(posPizarraX, posPizarraY),
        anchor("center"),
        scale(0.5),
        z(5)
      ]);

      crearZonaInteractiva(posPizarraX, posPizarraY, 450, 300, () => {
        if (itemSeleccionado === "encendedor") {
          animarFuego(posPizarraX, posPizarraY, () => {
            s3_pizarraQuemada = true;
            mostrarTexto("The cork board burned fiercely and collapsed! A shiny key fell to the floor...");
            go("sala3");
          });
        } else if (itemSeleccionado === "papel" && !s3_papelPinchado) {
          s3_papelPinchado = true;
          removerDelInventario("papel");
          mostrarTexto("You pinned the note to the board. Suddenly, a knife pops out from the side!");
          go("sala3");
        } else if (s3_papelPinchado) {
          mostrarTexto("The note is firmly pinned to the cork board.");
        } else {
          mostrarTexto("An empty cork board.");
        }
      });

      // Cuchillo al lado de la pizarra
      if (s3_papelPinchado && !s3_cuchilloRecogido) {
        add([
          sprite("cuchillo"),
          pos(620, 260),
          anchor("center"),
          scale(0.35),
          z(6)
        ]);

        crearZonaInteractiva(620, 260, 120, 120, () => {
          s3_cuchilloRecogido = true;
          agregarAlInventario("cuchillo", "Knife");
          mostrarTexto("You picked up the knife.");
          go("sala3");
        });
      }
    } else if (!s3_llaveSalidaRecogida) {
      // Llave de salida caída tras quemar la pizarra
      add([
        sprite("llave"),
        pos(posPizarraX, posPizarraY + 200),
        anchor("center"),
        scale(0.35),
        z(6)
      ]);

      crearZonaInteractiva(posPizarraX, posPizarraY + 200, 120, 120, () => {
        s3_llaveSalidaRecogida = true;
        play("llaveSFX");
        agregarAlInventario("llave_salida", "Exit Key");
        mostrarTexto("You picked up the key to the exit door!");
        go("sala3");
      });
    }

    // ---------------------------------------------------------------------
    // PASO 3: OSITO DE PELUCHE
    // ---------------------------------------------------------------------
    const ositoX = 320;
    const ositoY = 800;
    const spriteOsitoNombre = s3_ositoRoto ? "osito_roto" : "osito";

    add([
      sprite(spriteOsitoNombre),
      pos(ositoX, ositoY),
      anchor("center"),
      scale(0.4),
      z(5)
    ]);

    crearZonaInteractiva(ositoX, ositoY, 200, 200, () => {
      if (itemSeleccionado === "encendedor") {
        mostrarTexto("Better not burn the teddy bear... whatever is inside might get destroyed too.");
      } else if (!s3_ositoRoto && itemSeleccionado === "cuchillo") {
        play("cortaSFX");
        s3_ositoRoto = true;
        s3_llave1Recogida = true;
        play("llaveSFX");
        agregarAlInventario("llave1", "Dresser Key");
        mostrarTexto("You sliced open the teddy bear with the knife. You retrieved a small key from inside!");
        go("sala3");
      } else if (s3_ositoRoto) {
        mostrarTexto("The teddy bear is torn open and empty.");
      } else {
        mostrarTexto("A very old teddy bear. It feels unusually bulky...");
      }
    });

    // ---------------------------------------------------------------------
    // PASO 4 Y 5: CÓMODA Y LÁMPARA
    // ---------------------------------------------------------------------
    const comodaX = 1520;
    const comodaY = 680;
    const lamparaY = 320;

    // Cómoda base
    add([
      sprite("comoda"),
      pos(comodaX, comodaY),
      anchor("center"),
      scale(0.55),
      z(5)
    ]);

    // Lámpara
    const spriteLampara = s3_focoPuesto ? "lampara_encendida" : "lampara_apagada";
    add([
      sprite(spriteLampara),
      pos(comodaX, lamparaY),
      anchor("center"),
      scale(0.55),
      z(6)
    ]);

    // Cajones superpuestos
    if (s3_cajon1Abierto) {
      add([sprite("cajon1_abierto"), pos(comodaX, comodaY), anchor("center"), scale(0.55), z(7)]);
    }
    if (s3_focoPuesto) {
      add([sprite("cajon2_abierto"), pos(comodaX, comodaY), anchor("center"), scale(0.55), z(7)]);
    }
    if (s3_acertijoResuelto) {
      add([sprite("cajon3_abierto"), pos(comodaX, comodaY), anchor("center"), scale(0.55), z(7)]);
    }

    // Zona interactiva Mueble + Lámpara
    crearZonaInteractiva(comodaX, 500, 400, 650, () => {
      if (itemSeleccionado === "encendedor") {
        mostrarTexto("The dresser is made of heavy wood, it won't burn easily.");
      } 
      else if (!s3_cajon1Abierto && itemSeleccionado === "llave1") {
        play("llaveSFX");
        play("cajonSFX");
        s3_cajon1Abierto = true;
        removerDelInventario("llave1");
        agregarAlInventario("foco", "Light Bulb");
        mostrarTexto("You unlocked the top drawer! You found a light bulb inside.");
        go("sala3");
      } 
      else if (s3_cajon1Abierto && !s3_focoPuesto && itemSeleccionado === "foco") {
        play("lamparaSFX");
        play("cajonSFX");
        s3_focoPuesto = true;
        s3_cuadernoRecogido = true;
        removerDelInventario("foco");
        agregarAlInventario("cuaderno", "Notebook");
        mostrarTexto("You screwed the bulb into the lamp. It lit up, unlocked the second drawer, and you got a Notebook!");
        go("sala3");
      } 
      else if (s3_cuadernoRecogido && !s3_acertijoResuelto) {
        const respuesta = window.prompt(
          'The notebook reads:\n"Some people count their days with the things they have in mind. How many things do I have in mind now?"\n\nEnter your answer:'
        );
        if (respuesta === "4") {
          play("cajonSFX");
          s3_acertijoResuelto = true;
          s3_encendedorRecogido = true;
          agregarAlInventario("encendedor", "Lighter");
          mostrarTexto("Correct answer! The bottom drawer unlocked and you obtained a Lighter!");
          go("sala3");
        } else {
          mostrarTexto("Nothing happened... that doesn't seem to be the correct answer.");
        }
      } else {
        mostrarTexto("An old wooden dresser with drawers and a lamp on top.");
      }
    });

    // ---------------------------------------------------------------------
    // PASO 6: PUERTA DE SALIDA (Arriba Centro)
    // ---------------------------------------------------------------------
    crearZonaInteractiva(960, 80, 250, 160, () => {
      if (itemSeleccionado === "llave_salida" || s3_llaveSalidaRecogida) {
        play("llaveSFX");
        removerDelInventario("llave_salida");
        mostrarTexto("You used the exit key. The door to Room 4 is now unlocked!");
        go("sala4");
      } else {
        mostrarTexto("The upper exit door is locked firmly with a heavy padlock.");
      }
    });
  });

  // --- REST OF ROOMS ---
  scene("sala4", () => { 
    add([
      sprite("sala4"), 
      pos(960, 540), 
      anchor("center"), 
      z(0)
    ]); 
  });

  scene("sala5", () => { 
    add([
      sprite("sala5"), 
      pos(960, 540), 
      anchor("center"), 
      z(0)
    ]); 
  });

  go("sala1");
</script>
</body>
</html>
