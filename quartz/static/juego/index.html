<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La casa.</title>
  <script src="https://unpkg.com/kaboom@3000.1.17/dist/kaboom.js"></script>
  <style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 40px; /* 👈 Cambia este número para aumentar o reducir el margen */
    background-color: #000000; /* Color del fondo de los márgenes */
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    width: 100vw;
  }
  canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
  }
</style>
</head>
<body>

<script>
  // 1. INICIALIZAR KABOOM
  kaboom({
    width: 1920,
    height: 1080,
    letterbox: true,
    background: [0, 0, 0],
  });

  // 2. CARGAR RECURSOS
  loadSprite("sala1", "assets/sala1.png");
  loadSprite("sala2", "assets/sala2.png");
  loadSprite("sala3", "assets/sala3.png");
  loadSprite("sala4", "assets/sala4.png");
  loadSprite("sala5", "assets/sala5.png");

  loadSound("musica", "assets/musica_fondo.mp3");
  loadSound("clickSFX", "assets/click.mp3");
  loadSound("hoverSFX", "assets/hover.mp3");

  // 3. FUNCIONES AUXILIARES Y AUDIO
  let musicaIniciada = false;

  function reproducirMusica() {
    if (!musicaIniciada) {
      play("musica", { loop: true, volume: 0.4 });
      musicaIniciada = true;
    }
  }

  function mostrarTexto(mensaje) {
    destroyAll("cajaTexto");

    add([
      rect(1600, 150, { radius: 12 }),
      pos(960, 950),
      anchor("center"),
      color(15, 15, 15),
      outline(3, rgb(231, 200, 160)),
      fixed(),
      "cajaTexto"
    ]);

    add([
      text(mensaje, { size: 36, width: 1500, align: "center" }),
      pos(960, 950),
      anchor("center"),
      color(238, 221, 204),
      fixed(),
      "cajaTexto"
    ]);

    wait(4, () => destroyAll("cajaTexto"));
  }

  function crearZonaInteractiva(x, y, ancho, alto, alHacerClic, alPasarMouse, alSalirMouse) {
    const zona = add([
      rect(ancho, alto),
      pos(x, y),
      opacity(0),
      area(),
    ]);

    let estaSobreElemento = false;

    zona.onClick(() => {
      reproducirMusica();
      play("clickSFX");
      setCursor("default");
      alHacerClic();
    });

    zona.onHover(() => {
      setCursor("pointer");
      if (!estaSobreElemento) {
        reproducirMusica();
        play("hoverSFX");
        estaSobreElemento = true;
      }
      if (alPasarMouse) alPasarMouse();
    });

    zona.onHoverEnd(() => {
      setCursor("default");
      estaSobreElemento = false;
      if (alSalirMouse) alSalirMouse();
    });

    return zona;
  }

  // =========================================================================
  //                             ESCENAS (SALAS)
  // =========================================================================

// --- SALA 1: JARDÍN DIGITAL ---
  scene("sala1", () => {
    add([sprite("sala1"), pos(0, 0)]);

    // 1. Flecha inferior: lleva a la Sala 2
    crearZonaInteractiva(547, 934, 127, 133, () => go("sala2"));

    // 2. Tallo / Yuyos laterales: abre el tag #yuyo
    crearZonaInteractiva(13, 1, 124, 529, () => {
      window.top.location.href = "https://salvamir.github.io/tags/yuyo";
    });

    crearZonaInteractiva(680, 931, 807, 144, () => {
      window.top.location.href = "https://salvamir.github.io/tags/helecho";
    });

    crearZonaInteractiva(1488, 302, 67, 641, () => {
      window.top.location.href = "https://salvamir.github.io/tags/arbolito";
    });

    crearZonaInteractiva(1420, 117, 146, 165, () => {
      window.top.location.href = "https://salvamir.github.io";
    });

    crearZonaInteractiva(6, 573, 102, 157, () => {
      mostrarTexto("Es una roca... quién sabe cual será su historia petrogenética.");
    });


  });

  // --- SALA 2 ---
  scene("sala2", () => {
    add([sprite("sala2"), pos(0, 0)]);

// --- SALA 2 ---
  scene("sala2", () => {
    add([sprite("sala2"), pos(0, 0)]);

    crearZonaInteractiva(680, 8, 182, 127, () => go("sala1"));
    crearZonaInteractiva(1379, 679, 187, 125, () => go("sala3"));
    crearZonaInteractiva(9, 675, 174, 138, () => go("sala4"));
  });

  // --- RESTO DE SALAS ---
  scene("sala3", () => { add([sprite("sala3"), pos(0, 0)]); });
  scene("sala4", () => { add([sprite("sala4"), pos(0, 0)]); });
  scene("sala5", () => { add([sprite("sala5"), pos(0, 0)]); });

  go("sala1");
</script>
</body>
</html>
