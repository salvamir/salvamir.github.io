<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Interactiva</title>
  <style>
    :root {
      --bg-main: #1a1714;
      --text-main: #e3ded6;
      --accent: #b7966c;
      --modal-bg: rgba(0, 0, 0, 0.85);
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: "New York", Georgia, serif;
    }

    .gallery-container {
      max-width: 1000px; /* Un poco más ancha para que luzcan las fotos */
      margin: 0 auto;
    }

    .gallery-title {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 2rem;
    }

    /* --- LA MAGIA ESTILO PINTEREST --- */
    .gallery-grid {
      column-count: 1;
      column-gap: 15px;
    }

    @media (min-width: 600px) {
      .gallery-grid { column-count: 2; }
    }

    @media (min-width: 1020px) {
      .gallery-grid { column-count: 3; }
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 15px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    /* Animación interactiva al pasar el mouse */
    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03); /* Zoom suave */
      filter: brightness(1.1); /* Lo ilumina un poquito */
    }

    /* --- ESTILOS DEL MODAL (LIGHTBOX) --- */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 999; 
      padding-top: 50px; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%; 
      overflow: auto; 
      background-color: var(--modal-bg);
      backdrop-filter: blur(5px);
    }

    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      animation: zoomIn 0.3s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
    }

    .close-btn:hover, .close-btn:focus {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="gallery-container">
  <h1 class="gallery-title">Mi Galería</h1>
  
  <div class="gallery-grid">
    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1506744626753-eda8151a74a0?w=500" alt="Paisaje 1">
    </div>
    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?w=500" alt="Arquitectura">
    </div>
    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1518098268026-4e89f1a2cd8e?w=500" alt="Diseño">
    </div>
    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=500" alt="Naturaleza vertical">
    </div>
    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=500" alt="Montaña">
    </div>
    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500" alt="Bosque">
    </div>
  </div>
</div>

<div id="imageModal" class="modal">
  <span class="close-btn">&times;</span>
  <img class="modal-content" id="modalImg">
</div>

<script>
  // Lógica interactiva para la galería
  document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImg");
    const closeBtn = document.querySelector(".close-btn");
    const galleryItems = document.querySelectorAll(".gallery-item img");

    // Abrir la imagen en grande al hacer click
    galleryItems.forEach(img => {
      img.addEventListener('click', function() {
        modal.style.display = "block";
        modalImg.src = this.src; // Le pasa la misma foto al modal
      });
    });

    // Cerrar con la cruz
    closeBtn.addEventListener('click', () => {
      modal.style.display = "none";
    });

    // Cerrar haciendo click en cualquier lado afuera de la imagen
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.style.display = "none";
      }
    });

    // Cerrar con la tecla Escape del teclado
    document.addEventListener('keydown', (e) => {
      if (e.key === "Escape" && modal.style.display === "block") {
        modal.style.display = "none";
      }
    });
  });
</script>

</body>
</html>
