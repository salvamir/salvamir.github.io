<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colección De Fotos</title>
  <style>
    :root {
      --bg-main: #1a1714; /* Color fijo y exacto de la página principal */
      --text-main: #e3ded6;
      --accent: #b7966c;
      --modal-bg: rgba(0, 0, 0, 0.85);
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-main) !important; /* Forzamos el fondo exacto */
      color: var(--text-main);
      font-family: "New York", Georgia, serif;
    }

    .gallery-container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* --- ENCABEZADO Y TÍTULO ENLACE --- */
    .gallery-title {
      text-align: center;
      margin-bottom: 2rem;
    }
    .gallery-title a {
      font-size: 2.5rem;
      color: var(--text-main);
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
      display: inline-block;
    }
    .gallery-title a:hover {
      color: var(--accent);
      transform: scale(1.02);
    }

    .gallery-grid {
      column-count: 1;
      column-gap: 15px;
    }

    @media (min-width: 600px) { .gallery-grid { column-count: 2; } }
    @media (min-width: 1020px) { .gallery-grid { column-count: 3; } }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 15px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
      filter: brightness(1.1);
    }

    /* --- MODAL (LIGHTBOX) --- */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 999; 
      padding-top: 50px; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%; 
      overflow: hidden; /* Evitamos doble scroll cuando está abierto */
      background-color: var(--modal-bg);
      backdrop-filter: blur(5px);
    }

    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      animation: zoomIn 0.3s ease forwards;
    }

    /* Animaciones de Entrada */
    @keyframes zoomIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Animaciones de Salida (Retorno suave) */
    .modal.closing {
      animation: fadeOutBg 0.25s ease forwards;
    }
    .modal.closing .modal-content {
      animation: zoomOut 0.25s ease forwards;
    }

    @keyframes fadeOutBg {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    @keyframes zoomOut {
      from { transform: scale(1); opacity: 1; }
      to { transform: scale(0.9); opacity: 0; }
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
      z-index: 1000;
    }

    .close-btn:hover {
      color: var(--accent);
    }

    /* --- BOTÓN IR ARRIBA --- */
    #goToTopBtn {
        display: none; 
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 998; /* Ajustado para que quede debajo del modal */
        font-size: 1.5rem;
        border: 1px solid rgba(183, 150, 108, 0.4);
        outline: none;
        background-color: rgba(13, 12, 10, 0.9);
        color: #B7966C; 
        cursor: pointer;
        width: 50px;
        height: 50px;
        border-radius: 50%; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        transition: background-color 0.3s, transform 0.2s, border-color 0.2s;
    }
    #goToTopBtn:hover {
        background-color: #B7966C;
        color: #0d0c0a;
        border-color: #E7C8A0;
        transform: translateY(-3px);
    }
  </style>
</head>
<body>

<div class="gallery-container">
  <h1 class="gallery-title"><a href="/" title="Volver al inicio">Mi Galería</a></h1>
  
  <div class="gallery-grid">
    <div class="gallery-item"><img src="./fotos-galeria/3.jpeg" alt="paquillo corriendo"></div>
    <div class="gallery-item"><img src="./fotos-galeria/8.jpg" alt="videollamada punta cana"></div>
    <div class="gallery-item"><img src="./fotos-galeria/dracamigomio.png" alt="estado fer"></div>
    <div class="gallery-item"><img src="./fotos-galeria/enfermo.jpg" alt="enfermo"></div>
    <div class="gallery-item"><img src="./fotos-galeria/facucumpliendomisueño.png" alt="legoland"></div>
    <div class="gallery-item"><img src="./fotos-galeria/felizcumplewid.jpeg" alt="mini leonchi"></div>
    <div class="gallery-item"><img src="./fotos-galeria/letiyleonchiminis.jpg" alt="minis"></div>
    <div class="gallery-item"><img src="./fotos-galeria/minileti.jpeg" alt="cute"></div>
    <div class="gallery-item"><img src="./fotos-galeria/mispapas.jpg" alt="papas"></div>
    <div class="gallery-item"><img src="./fotos-galeria/salvaylolopequeños.jpg" alt="pequeños"></div>
    <div class="gallery-item"><img src="./fotos-galeria/salvaylolopequeño.jpg" alt="otros tiempos tio"></div>
    <div class="gallery-item"><img src="./fotos-galeria/paseandoconlaemii.jpg" alt="paseando"></div>
    <div class="gallery-item"><img src="./fotos-galeria/otoñoenmicasa.jpg" alt="otoño casa"></div>
    <div class="gallery-item"><img src="./fotos-galeria/sanpedro.jpg" alt="escuela de campo II"></div>
    <div class="gallery-item"><img src="./fotos-galeria/otoñoenlafacultad.jpg" alt="otoño facultad"></div>
  </div>
</div>

<div id="imageModal" class="modal">
  <span class="close-btn">&times;</span>
  <img class="modal-content" id="modalImg">
</div>

<button id="goToTopBtn" title="Volver arriba">&#8593;</button>

<script>
  const modal = document.getElementById("imageModal");
  const modalImg = document.getElementById("modalImg");
  const closeBtn = document.querySelector(".close-btn");
  let isModalOpen = false;
  
  // Función centralizada para cerrar el modal suavemente
  function closeModal() {
    if (!isModalOpen || modal.classList.contains("closing")) return;
    
    // Agregamos la clase que dispara la animación CSS de salida
    modal.classList.add("closing");
    
    // Esperamos a que termine la animación (250ms) para ocultar de verdad
    setTimeout(() => {
      modal.style.display = "none";
      modal.classList.remove("closing");
      isModalOpen = false;
    }, 250);
  }

  // Abrir imagen
  document.querySelectorAll(".gallery-item img").forEach(img => {
    img.onclick = function() {
      modal.style.display = "block";
      modalImg.src = this.src; 
      isModalOpen = true;
    }
  });

  // Eventos para cerrar la imagen
  closeBtn.onclick = closeModal;
  modal.onclick = (e) => { if (e.target === modal) closeModal(); };
  document.addEventListener('keydown', (e) => { if (e.key === "Escape") closeModal(); });

  // ¡NUEVO!: Cierra suavemente la imagen si el usuario hace scroll
  window.addEventListener('scroll', () => {
    if (isModalOpen) closeModal();
  });

  // --- LÓGICA DEL BOTÓN IR ARRIBA ---
  const goToTopBtn = document.getElementById("goToTopBtn");

  window.addEventListener('scroll', () => {
      // Ignorar la lógica del botón si el modal está abierto para evitar conflictos
      if (isModalOpen) return; 

      if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
          goToTopBtn.style.display = "block";
      } else {
          goToTopBtn.style.display = "none";
      }
  });

  goToTopBtn.addEventListener('click', () => {
      window.scrollTo({
          top: 0,
          behavior: 'smooth'
      });
  });
</script>
</body>
</html>
