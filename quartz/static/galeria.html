<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colección De Fotos</title>
  <style>
    :root {
      --bg-main: #1a1714;
      --text-main: #e3ded6;
      --accent: #b7966c;
      --modal-bg: rgba(0, 0, 0, 0.85);
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: "New York", Georgia, serif;
    }

    .gallery-container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .gallery-title {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 2rem;
    }

    .gallery-grid {
      column-count: 1;
      column-gap: 15px;
    }

    @media (min-width: 600px) { .gallery-grid { column-count: 2; } }
    @media (min-width: 1020px) { .gallery-grid { column-count: 3; } }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 15px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
      filter: brightness(1.1);
    }

    .modal {
      display: none; 
      position: fixed; 
      z-index: 999; 
      padding-top: 50px; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%; 
      overflow: auto; 
      background-color: var(--modal-bg);
      backdrop-filter: blur(5px);
    }

    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      animation: zoomIn 0.3s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
    }

    .close-btn:hover {
      color: var(--accent);
    }

    /* --- BOTÓN IR ARRIBA --- */
    #goToTopBtn {
        display: none; 
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 999;
        font-size: 1.5rem;
        border: 1px solid rgba(183, 150, 108, 0.4);
        outline: none;
        background-color: rgba(13, 12, 10, 0.9);
        color: #B7966C; 
        cursor: pointer;
        width: 50px;
        height: 50px;
        border-radius: 50%; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        transition: background-color 0.3s, transform 0.2s, border-color 0.2s;
    }
    #goToTopBtn:hover {
        background-color: #B7966C;
        color: #0d0c0a;
        border-color: #E7C8A0;
        transform: translateY(-3px);
    }
  </style>
</head>
<body>

<div class="gallery-container">
  <h1 class="gallery-title">Mi Galería</h1>
  <div class="gallery-grid">
    <div class="gallery-item"><img src="./fotos-galeria/3.jpeg" alt="paquillo corriendo"></div>
    <div class="gallery-item"><img src="./fotos-galeria/8.jpg" alt="videollamada punta cana"></div>
    <div class="gallery-item"><img src="./fotos-galeria/dracamigomio.png" alt="estado fer"></div>
    <div class="gallery-item"><img src="./fotos-galeria/enfermo.jpg" alt="enfermo"></div>
    <div class="gallery-item"><img src="./fotos-galeria/facucumpliendomisueño.png" alt="legoland"></div>
    <div class="gallery-item"><img src="./fotos-galeria/felizcumplewid.jpeg" alt="mini leonchi"></div>
    <div class="gallery-item"><img src="./fotos-galeria/letiyleonchiminis.jpg" alt="minis"></div>
    <div class="gallery-item"><img src="./fotos-galeria/minileti.jpeg" alt="cute"></div>
    <div class="gallery-item"><img src="./fotos-galeria/mispapas.jpg" alt="papas"></div>
    <div class="gallery-item"><img src="./fotos-galeria/salvaylolopequeños.jpg" alt="pequeños"></div>
<div class="gallery-item"><img src="./fotos-galeria/salvaylolopequeño.jpg" alt="otros tiempos tio"></div>
    <div class="gallery-item"><img src="./fotos-galeria/paseandoconlaemii.jpg" alt="paseando"></div>
    <div class="gallery-item"><img src="./fotos-galeria/otoñoenmicasa.jpg" alt="otoño casa"></div>
<div class="gallery-item"><img src="./fotos-galeria/sanpedro.jpg" alt="escuela de campo II"></div>
    <div class="gallery-item"><img src="./fotos-galeria/otoñoenlafacultad.jpg" alt="otoño facultad"></div>
  </div>
</div>

<div id="imageModal" class="modal">
  <span class="close-btn">&times;</span>
  <img class="modal-content" id="modalImg">
</div>

<button id="goToTopBtn" title="Volver arriba">&#8593;</button>

<script>
  const modal = document.getElementById("imageModal");
  const modalImg = document.getElementById("modalImg");
  const closeBtn = document.querySelector(".close-btn");
  
  document.querySelectorAll(".gallery-item img").forEach(img => {
    img.onclick = function() {
      modal.style.display = "block";
      modalImg.src = this.src; 
    }
  });

  closeBtn.onclick = () => modal.style.display = "none";
  modal.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };
  document.addEventListener('keydown', (e) => { if (e.key === "Escape") modal.style.display = "none"; });

  // --- LÓGICA DEL BOTÓN IR ARRIBA ---
  const goToTopBtn = document.getElementById("goToTopBtn");

  // Detectar el scroll para mostrar u ocultar el botón
  window.addEventListener('scroll', () => {
      if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
          goToTopBtn.style.display = "block";
      } else {
          goToTopBtn.style.display = "none";
      }
  });

  // Al hacer clic, subir suavemente
  goToTopBtn.addEventListener('click', () => {
      window.scrollTo({
          top: 0,
          behavior: 'smooth'
      });
  });
</script>
</body>
</html>
