<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahora — Salva Más De Cerca</title>
  <style>
    footer {
      margin-top: 2rem;
      padding-bottom: 2rem;
    }
    footer hr {
      border: 0;
      border-top: 1px solid currentColor;
      opacity: 0.2;
      margin-bottom: 1rem;
    }
    .footer-list {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 1.25rem;
      list-style: none;
      padding: 0;
      margin: 1rem 0 0 0;
    }
    .footer-list a,
    .footer-list button {
      color: inherit;
      display: inline-flex;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-decoration: none;
    }

    /* Visibilidad del icono Sol / Luna según el modo activo */
    html[saved-theme="dark"] .darkmode .sun { display: inline-block !important; }
    html[saved-theme="dark"] .darkmode .moon { display: none !important; }
    html[saved-theme="light"] .darkmode .sun { display: none !important; }
    html[saved-theme="light"] .darkmode .moon { display: inline-block !important; }
    html:not([saved-theme]) .darkmode .sun { display: inline-block !important; }
    html:not([saved-theme]) .darkmode .moon { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1><a href="/">Ahora</a></h1>
    <p>Archivo de lo que voy viviendo.</p>
  </header>

  <main>
    <!-- Contenido de tu página -->
  </main>

  <footer>
    <hr />
    <ul class="footer-list">
      <!-- 1. RSS Feed -->
      <li>
        <a href="/index.xml" aria-label="RSS Feed">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 11a9 9 0 0 1 9 9" />
            <path d="M4 4a16 16 0 0 1 16 16" />
            <circle cx="5" cy="19" r="1" />
          </svg>
        </a>
      </li>

      <!-- 2. Correo -->
      <li>
        <a href="mailto:pez.arroz.tabla@proton.me" aria-label="Correo">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2" />
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
          </svg>
        </a>
      </li>

      <!-- 3. Modo Oscuro / Claro -->
      <li>
        <button class="darkmode" id="darkmode-toggle" aria-label="Cambiar modo oscuro">
          <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" />
            <path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" />
            <path d="M20 12h2" />
            <path d="m4.93 19.07 1.41-1.41" />
            <path d="m17.66 6.34 1.41-1.41" />
          </svg>
          <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </button>
      </li>

      <!-- 4. Volver arriba -->
      <li>
        <button onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" aria-label="Volver arriba">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5" />
            <path d="m5 12 7-7 7 7" />
          </svg>
        </button>
      </li>
    </ul>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const toggle = document.getElementById("darkmode-toggle");
      if (!toggle) return;

      const getTheme = () => {
        return localStorage.getItem("theme") || 
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      };

      const setTheme = (theme) => {
        document.documentElement.setAttribute("saved-theme", theme);
        localStorage.setItem("theme", theme);
      };

      setTheme(getTheme());

      toggle.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("saved-theme") || getTheme();
        const next = current === "dark" ? "light" : "dark";
        setTheme(next);
      });
    });
  </script>
</body>
</html>
