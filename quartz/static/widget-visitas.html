<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* --- VARIABLES POR DEFECTO (MODO CLARO - INTEGRADO AL MARRÓN PRINCIPAL) --- */
    :root {
      --bg-canvas: #1a1714; /* ¡Cambiado de #faf7f2 para eliminar el bloque blanco! */
      --bg-card: rgba(255, 255, 255, 0.03);
      --text-main: #e3ded6;
      --accent: #b7966c;
      --border-color: rgba(168, 158, 149, 0.3);
      --input-bg: rgba(0, 0, 0, 0.2);
    }
    
    /* --- VARIABLES EN MODO OSCURO (NEGRO ABSOLUTO) --- */
    html[data-theme="dark"], body.dark-mode {
      --bg-canvas: #000000 !important;
      --bg-card: rgba(60, 60, 60, 0.2) !important;
      --text-main: #e0eaf5 !important;
      --accent: #84add7 !important;
      --border-color: rgba(224, 234, 245, 0.2) !important;
      --input-bg: rgba(0, 0, 0, 0.6) !important;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-canvas) !important;
      color: var(--text-main);
      font-family: "New York", Georgia, serif;
      transition: background 0.3s ease, color 0.3s ease;
    }
    
    .guestbook-container {
      padding: 10px;
      max-width: 100%;
      box-sizing: border-box;
      background: var(--bg-canvas) !important;
    }
  </style>
</head>
<body>

  <div class="guestbook-container">
    </div>

  <script>
  function triggerResizeUpdate() {
    const realHeight = document.documentElement.scrollHeight || document.body.scrollHeight;
    window.parent.postMessage({ type: 'resize-iframe', height: realHeight }, '*');
    
    try {
      const parentIframe = window.parent.document.getElementById('visitas-iframe');
      if (parentIframe) parentIframe.style.height = realHeight + 'px';
    } catch (e) {}
  }

  const resizeObserver = new ResizeObserver(() => triggerResizeUpdate());
  window.addEventListener('load', () => {
    const container = document.querySelector('.guestbook-container');
    if (container) resizeObserver.observe(container);
    setTimeout(triggerResizeUpdate, 1000);
  });

  // --- SINCRONIZADOR DEFINITIVO EN TIEMPO REAL CON QUARTZ ---
  function syncTheme() {
    let isDark = localStorage.getItem('theme') === 'dark';
    
    try {
      if (window.parent && window.parent.document) {
        const parentHtml = window.parent.document.documentElement;
        if (parentHtml.getAttribute('saved-theme') === 'dark' || parentHtml.classList.contains('dark')) {
          isDark = true;
        }
      }
    } catch(e) {}

    const htmlRoot = document.documentElement;
    if (isDark) {
      htmlRoot.setAttribute('data-theme', 'dark');
      document.body.classList.add('dark-mode');
    } else {
      htmlRoot.setAttribute('data-theme', 'light');
      document.body.classList.remove('dark-mode');
    }
    triggerResizeUpdate();
  }

  syncTheme();
  window.addEventListener('storage', (e) => { if (e.key === 'theme') syncTheme(); });

  // MutationObserver para capturar el cambio al hacer clic en el botón flotante del inicio sin recargar
  try {
    if (window.parent && window.parent.document) {
      const observer = new MutationObserver(() => syncTheme());
      observer.observe(window.parent.document.documentElement, {
        attributes: true,
        attributeFilter: ['saved-theme', 'class']
      });
    }
  } catch (e) {}
  </script>
</body>
</html>
