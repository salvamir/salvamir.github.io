<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Música</title>
  <style>
    :root {
      --bg-main: #1a1714;
      --bg-card: rgba(255, 255, 255, 0.03);
      --text-main: #e3ded6;
      --accent: #b7966c;
      --border-color: rgba(168, 158, 149, 0.3);
      --page-header-bg: transparent;
      --header-padding: 0px; /* Manejo limpio por variables */
    }
    
    /* --- PALETA MODO OSCURO SOLICITADA --- */
    body.dark-mode {
      --bg-main: #000000;
      --bg-card: rgba(60, 60, 60, 0.2);
      --text-main: #e0eaf5;
      --accent: #84add7;
      --border-color: rgba(224, 234, 245, 0.2);
      --page-header-bg: transparent; /* CORREGIDO: Evita que aparezca un recuadro molesto recubriendo el título */
      --header-padding: 0px;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: "New York", 'Times New Roman', Georgia, serif;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Estilo para los links dentro del análisis */
    .full-review a {
      color: var(--accent);
      text-decoration: none; 
      font-weight: bold; 
      transition: opacity 0.2s ease;
    }

    .full-review a:hover {
      opacity: 0.8;
      text-decoration: underline; 
    }

    body.dark-mode .full-review a {
      color: #a3c2e1;
    }

    .container {
      max-width: 100%;
      margin: 0 auto;
      padding: 10px;
      box-sizing: border-box;
      padding-bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Título y Cabecera */
    .page-header {
      text-align: center;
      margin-bottom: 3rem;
      background: var(--page-header-bg);
      padding: var(--header-padding);
      border-radius: 24px;
      transition: background 0.3s ease;
    }
    
    .page-title {
      font-family: 'Times New Roman', serif;
      font-size: 2.5rem;
      color: #E7C8A0;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 0.5rem;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    
    body.dark-mode .page-title {
      color: #e0eaf5;
    }
    
    .page-desc {
      font-size: 1.1rem;
      opacity: 0.8;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Grilla Dinámica */
    .music-grid {
      width: 100%;
      max-width: 1200px;
      column-gap: 20px;
    }
    @media (max-width: 599px) { .music-grid { column-count: 1; } }
    @media (min-width: 600px) and (max-width: 899px) { .music-grid { column-count: 2; } }
    @media (min-width: 900px) { .music-grid { column-count: 3; } }

    /* Tarjetas */
    .album-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 20px;
      break-inside: avoid;
      page-break-inside: avoid;
      -webkit-column-break-inside: avoid;
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.3s ease, transform 0.2s ease, background 0.3s ease;
    }
    .album-card:hover {
      border-color: var(--accent);
    }

    /* Contenedor Portada */
    .cover-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #000;
      overflow: hidden;
      cursor: zoom-in;
    }
    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s, transform 0.3s ease;
    }
    .cover-img:hover {
      opacity: 0.85;
    }
    .play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(26, 23, 20, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .cover-container:hover .play-overlay {
      opacity: 1;
    }
    .play-btn {
      background: var(--accent);
      color: #1a1714;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding-left: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: transform 0.2s;
    }
    body.dark-mode .play-btn {
      color: #000000;
    }
    .play-btn:hover {
      transform: scale(1.1);
    }

    /* Textos */
    .album-info {
      padding: 16px;
      cursor: pointer;
    }
    .album-title {
      font-size: 1.3rem;
      margin: 0 0 5px 0;
      color: var(--accent);
      font-family: system-ui, sans-serif;
    }
    body.dark-mode .album-title {
      color: #e0eaf5;
    }
    .album-artist {
      font-size: 0.95rem;
      margin: 0 0 12px 0;
      opacity: 0.7;
      font-family: system-ui, sans-serif;
    }
    body.dark-mode .album-artist {
      color: #a3c2e1;
    }
    .album-summary {
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0;
      opacity: 0.9;
    }
    .read-more-text {
      color: var(--accent);
      font-weight: bold;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      display: block;
      margin-top: 10px;
    }
    .full-review {
      display: none;
    }

    /* Estilos Botón Modo Oscuro */
    .dark-mode-toggle {
        background: none;
        border: 1px solid var(--border-color);
        color: var(--accent);
        padding: 10px 20px;
        border-radius: 20px;
        cursor: pointer;
        font-family: system-ui, sans-serif;
        font-size: 0.9rem;
        margin: 2rem 0;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .dark-mode-toggle:hover {
        background-color: var(--bg-card);
        border-color: var(--accent);
        color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="page-header">
      <a href="/" class="page-title">Salva Más De Cerca</a>
      <p class="page-desc">Opiniones y apreciaciones sobre álbumes de música.</p>
    </header>

    <div class="music-grid">
      </div>

    <button id="darkModeToggle" class="dark-mode-toggle">
        <span id="darkModeIcon">☀️</span> Modo Claro
    </button>
  </div>

  <script>
    const toggleBtn = document.getElementById('darkModeToggle');
    const toggleIcon = document.getElementById('darkModeIcon');

    function updateToggleBtn() {
        if (document.body.classList.contains('dark-mode')) {
            toggleIcon.innerText = "🌙";
            toggleBtn.innerHTML = '<span id="darkModeIcon">🌙</span> Modo Oscuro';
        } else {
            toggleIcon.innerText = "☀️";
            toggleBtn.innerHTML = '<span id="darkModeIcon">☀️</span> Modo Claro';
        }
    }

    // Cargar preferencia persistente compartida
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
    updateToggleBtn();

    toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        if (document.body.classList.contains('dark-mode')) {
            localStorage.setItem('theme', 'dark');
        } else {
            localStorage.setItem('theme', 'light');
        }
        updateToggleBtn();
    });
  </script>
</body>
</html>
