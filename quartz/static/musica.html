<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Música</title>
  <style>
    :root {
      --bg-main: #1a1714;
      --bg-card: rgba(255, 255, 255, 0.03);
      --text-main: #e3ded6;
      --accent: #b7966c;
      --border-color: rgba(168, 158, 149, 0.3);
    }
    
    /* --- PALETA MODO OSCURO SIN RECUADROS --- */
    html[data-theme="dark"], body.dark-mode {
      --bg-main: #000000;
      --bg-card: rgba(60, 60, 60, 0.2);
      --text-main: #e0eaf5;
      --accent: #84add7;
      --border-color: rgba(224, 234, 245, 0.2);
    }
    
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: "New York", 'Times New Roman', Georgia, serif;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .full-review a {
      color: var(--accent);
      text-decoration: none; 
      font-weight: bold; 
      transition: opacity 0.2s ease;
    }

    .full-review a:hover {
      opacity: 0.8;
      text-decoration: underline; 
    }

    html[data-theme="dark"] .full-review a {
      color: #a3c2e1;
    }

    .container {
      max-width: 100%;
      margin: 0 auto;
      padding: 10px;
      box-sizing: border-box;
      padding-bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Título y Cabecera Limpios */
    .page-header {
      text-align: center;
      margin-bottom: 3rem;
      background: transparent !important; 
      padding: 0;
      border-radius: 0;
    }
    
    .page-title {
      font-family: 'Times New Roman', serif;
      font-size: 2.5rem;
      color: #E7C8A0;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 0.5rem;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    
    html[data-theme="dark"] .page-title {
      color: #e0eaf5;
    }
    
    .page-desc {
      font-size: 1.1rem;
      opacity: 0.8;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Grilla Dinámica */
    .music-grid {
      width: 100%;
      max-width: 1200px;
      column-gap: 20px;
    }
    @media (max-width: 599px) { .music-grid { column-count: 1; } }
    @media (min-width: 600px) and (max-width: 899px) { .music-grid { column-count: 2; } }
    @media (min-width: 900px) { .music-grid { column-count: 3; } }

    /* Tarjetas */
    .album-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 20px;
      break-inside: avoid;
      page-break-inside: avoid;
      -webkit-column-break-inside: avoid;
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.3s ease, transform 0.2s ease, background 0.3s ease;
    }
    .album-card:hover {
      border-color: var(--accent);
    }

    .cover-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #000;
      overflow: hidden;
      cursor: zoom-in;
    }
    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s, transform 0.3s ease;
    }
    .cover-img:hover {
      opacity: 0.85;
    }
    .play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(26, 23, 20, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .cover-container:hover .play-overlay {
      opacity: 1;
    }
    .play-btn {
      background: var(--accent);
      color: #1a1714;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding-left: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: transform 0.2s;
    }
    html[data-theme="dark"] .play-btn {
      color: #000000;
    }
    .play-btn:hover {
      transform: scale(1.1);
    }

    .album-info {
      padding: 16px;
      cursor: pointer;
    }
    .album-title {
      font-size: 1.3rem;
      margin: 0 0 5px 0;
      color: var(--accent);
      font-family: system-ui, sans-serif;
    }
    html[data-theme="dark"] .album-title {
      color: #e0eaf5;
    }
    .album-artist {
      font-size: 0.95rem;
      margin: 0 0 12px 0;
      opacity: 0.7;
      font-family: system-ui, sans-serif;
    }
    html[data-theme="dark"] .album-artist {
      color: #a3c2e1;
    }
    .album-summary {
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0;
      opacity: 0.9;
    }
    .read-more-text {
      color: var(--accent);
      font-weight: bold;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      display: block;
      margin-top: 10px;
    }
    .full-review {
      display: none;
    }

    /* Botón simplificado solo con icono */
    .dark-mode-toggle {
        background: none;
        border: 1px solid var(--border-color);
        color: var(--text-main);
        width: 45px;
        height: 45px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.2rem;
        margin: 2rem 0;
        transition: all 0.3s ease;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .dark-mode-toggle:hover {
        background-color: var(--bg-card);
        border-color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="page-header">
      <a href="/" class="page-title" title="Volver al inicio">Música</a>
      <p class="page-desc">Mi colección de música.</p>
    </header>

    <div class="music-grid">
      <div class="album-card">
        <div class="cover-container" data-embed="https://www.youtube.com/embed/videoseries?si=CuINtYrUFCXCEIu0&list=OLAK5uy_kG_IyeAEb5Vyhxr0ETM73qmimj_WnMiLk&autoplay=1">
          <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fis1-ssl.mzstatic.com%2Fimage%2Fthumb%2FMusic221%2Fv4%2F66%2Fee%2F30%2F66ee30fe-df8b-4bba-a77a-bd8d4704f408%2F24UMGIM72459.rgb.jpg%2F1200x1200bf-60.jpg&f=1&nofb=1&ipt=f238657cc30278613eef8e19f83365a6aed63cf510dfcf31d3464fa1b372fc3c" alt="Portada de Love & Hyperbole" class="cover-img">
          <div class="play-overlay">
            <button class="play-btn" title="Reproducir en YouTube">▶</button>
          </div>
        </div>
        <div class="album-info">
          <h2 class="album-title">Love & Hyperbole</h2>
          <p class="album-artist">Alessia Cara</p>
          <div class="album-summary">
            Este disco es una revolución de Alessia para nosotros sus fans. Es el primer trabajo en el que explora estilos como el folk, balada romántica y rock pop, demostrando un inmenso avance en su carrera.
            <span class="read-more-text">Leer análisis completo ⬎</span>
          </div>
        </div>
      </div>
    </div>

    <button id="darkModeToggle" class="dark-mode-toggle" aria-label="Cambiar modo">
        ☀️
    </button>
  </div>

  <script>
    const toggleBtn = document.getElementById('darkModeToggle');
    const htmlRoot = document.documentElement;

    function applyTheme(theme) {
        if (theme === 'dark') {
            document.body.classList.add('dark-mode');
            htmlRoot.setAttribute('data-theme', 'dark');
            toggleBtn.innerText = "🌙";
        } else {
            document.body.classList.remove('dark-mode');
            htmlRoot.setAttribute('data-theme', 'light');
            toggleBtn.innerText = "☀️";
        }
    }

    // Sincronizar unificado con Quartz y LocalStorage global
    const savedTheme = localStorage.getItem('theme') || 'light';
    applyTheme(savedTheme);

    toggleBtn.addEventListener('click', () => {
        const currentTheme = htmlRoot.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', currentTheme);
        applyTheme(currentTheme);
    });

    // --- SINCRONIZADOR GLOBAL DEFINITIVO DE RESIZE DE IFRAME ---
    setInterval(() => {
      try {
        const h = document.body.scrollHeight;
        const parentIframe = window.parent.document.getElementById('musica-iframe');
        if (parentIframe && parentIframe.style.height !== h + 'px') {
          parentIframe.style.height = h + 'px';
        }
      } catch(e) {}
    }, 300);
  </script>
</body>
</html>
